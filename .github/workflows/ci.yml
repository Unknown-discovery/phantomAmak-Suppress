name: C++ reference runtime
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitize: ["OFF", "ON"]
        avx2: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DAMAK_SANITIZE=${{ matrix.sanitize }} -DAMAK_ENABLE_AVX2=${{ matrix.avx2 }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
